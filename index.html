<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta-Test-Hub 通用人格测评中心</title>
<style>
/* ====== CSS Reset & Variables ====== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#5B6CFF;--primary-light:#7B8BFF;--primary-dark:#3A4AE0;
  --secondary:#8B7AE0;--secondary-light:#A99BED;--secondary-dark:#6C5AD1;
  --mint:#4FC3A7;--mint-light:#6ED2BA;
  --accent:#F59E76;
  --bg:#F5F7FB;--bg-2:#EEF2F9;--card:#FFFFFF;--card-2:#FAFBFE;
  --text:#1D2438;--text-secondary:#5C6784;--text-muted:#8A93A9;
  --border:#E1E6EF;--border-strong:#D1D8E6;
  --shadow-xs:0 1px 3px rgba(17,24,39,.05);
  --shadow-sm:0 2px 6px rgba(17,24,39,.05),0 1px 2px rgba(17,24,39,.03);
  --shadow:0 4px 16px rgba(17,24,39,.06),0 2px 4px rgba(17,24,39,.04);
  --shadow-md:0 8px 24px rgba(17,24,39,.08),0 2px 8px rgba(17,24,39,.05);
  --shadow-lg:0 16px 48px rgba(17,24,39,.10),0 4px 12px rgba(17,24,39,.06);
  --shadow-primary:0 8px 24px rgba(91,108,255,.25),0 2px 8px rgba(91,108,255,.15);
  --shadow-hover:0 14px 40px rgba(91,108,255,.16),0 4px 12px rgba(17,24,39,.06);
  --radius:14px;--radius-sm:10px;--radius-lg:22px;--radius-xl:28px;
  --font-base:16px;--transition:.28s cubic-bezier(.4,0,.2,1);--transition-lg:.4s cubic-bezier(.22,1,.36,1);
  --font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --primary:#7B8BFF;--primary-light:#9BA9FF;--primary-dark:#5B6CFF;
  --secondary:#A99BED;--secondary-light:#C4B9F5;--secondary-dark:#8B7AE0;
  --mint:#6ED2BA;--mint-light:#8ADECB;
  --accent:#F59E76;
  --bg:#111628;--bg-2:#181F38;--card:rgba(30,38,60,.88);--card-2:rgba(36,44,68,.85);
  --text:#E8ECF7;--text-secondary:#A7AFCA;--text-muted:#78819C;
  --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --shadow-xs:0 1px 3px rgba(0,0,0,.3);
  --shadow-sm:0 2px 8px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.2);
  --shadow:0 4px 20px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --shadow-md:0 8px 32px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.4);
  --shadow-primary:0 8px 28px rgba(123,139,255,.35),0 2px 10px rgba(123,139,255,.2);
  --shadow-hover:0 16px 52px rgba(123,139,255,.25),0 4px 14px rgba(0,0,0,.4);
}
html{font-size:var(--font-base);scroll-behavior:smooth;}
body{
  font-family:var(--font-family);color:var(--text);background:var(--bg);
  line-height:1.7;min-height:100vh;transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb,var(--primary) 10%,transparent) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 10%, color-mix(in srgb,var(--secondary) 8%,transparent) 0%, transparent 55%);
  background-attachment:fixed;
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb,var(--primary) 15%,transparent) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 10%, color-mix(in srgb,var(--secondary) 12%,transparent) 0%, transparent 55%);
}
/* ========== Font Size Global Scale (三档全量覆盖) ========== */
/* 大档 */
body[data-font="large"]{
  --font-base:18px;
  font-size:1.02rem;
}
body[data-font="large"] .hero-title{font-size:2.6rem;}
body[data-font="large"] .hero-sub{font-size:1.18rem;}
body[data-font="large"] .hero-desc,body[data-font="large"] .page-sub,body[data-font="large"] .section-sub{font-size:1.02rem;}
body[data-font="large"] .section-title{font-size:1.75rem;}
body[data-font="large"] .page-title{font-size:2rem;}
body[data-font="large"] .test-card-title{font-size:1.28rem;}
body[data-font="large"] .test-card-desc{font-size:.98rem;}
body[data-font="large"] .quiz-question{font-size:1.3rem;}
body[data-font="large"] .quiz-option-text{font-size:1.06rem;}
body[data-font="large"] .quiz-hint,body[data-font="large"] .nickname-label{font-size:.94rem;}
body[data-font="large"] .result-type-code{font-size:2.7rem;}
body[data-font="large"] .result-type-name{font-size:1.55rem;}
body[data-font="large"] .result-summary{font-size:1.08rem;}
body[data-font="large"] .mode-switch-btn{font-size:.98rem;}
body[data-font="large"] .chart-card h4,body[data-font="large"] .compare-col h3{font-size:1.1rem;}
body[data-font="large"] .report-module h3{font-size:1.2rem;}
body[data-font="large"] .report-module p,.report-module li{font-size:1.04rem;line-height:1.9;}
body[data-font="large"] p.mod-p{font-size:1.05rem;line-height:2;}
body[data-font="large"] .report-blockquote{font-size:1.04rem;line-height:1.95;}
body[data-font="large"] .mod-subheading{font-size:1.06rem;}
body[data-font="large"] .module-tip{font-size:.95rem;}
body[data-font="large"] .risk-callout{font-size:1rem;}
body[data-font="large"] .risk-tag,body[data-font="large"] .skipped-badge{font-size:.86rem;}
body[data-font="large"] .btn{font-size:1rem;}
body[data-font="large"] .btn-lg{font-size:1.12rem;}
body[data-font="large"] .btn-sm{font-size:.92rem;}
body[data-font="large"] .nav-btn{font-size:.98rem;}
body[data-font="large"] .trait-chip{font-size:.92rem;}
body[data-font="large"] .history-item-title{font-size:1.08rem;}
body[data-font="large"] .history-item-meta,.setting-desc{font-size:.92rem;}
body[data-font="large"] .data-section h3{font-size:1.25rem;}
body[data-font="large"] .settings-group h3{font-size:1.2rem;}
body[data-font="large"] .setting-name{font-size:1.02rem;}
body[data-font="large"] .seg-btn{font-size:.94rem;}
body[data-font="large"] .overview-summary-card p{font-size:1.02rem;}
body[data-font="large"] .footer-disclaimer{font-size:.9rem;}
body[data-font="large"] .disclaimer{font-size:.96rem;}
body[data-font="large"] .empty-state-title{font-size:1.3rem;}
body[data-font="large"] .empty-state-desc{font-size:1rem;}
body[data-font="large"] .modal-title{font-size:1.3rem;}
body[data-font="large"] .modal-body{font-size:1.02rem;}

/* 更大档 */
body[data-font="xlarge"]{
  --font-base:20px;
  font-size:1.08rem;
}
body[data-font="xlarge"] .hero-title{font-size:3rem;}
body[data-font="xlarge"] .hero-sub{font-size:1.28rem;}
body[data-font="xlarge"] .hero-desc,body[data-font="xlarge"] .page-sub,body[data-font="xlarge"] .section-sub{font-size:1.1rem;}
body[data-font="xlarge"] .section-title{font-size:1.9rem;}
body[data-font="xlarge"] .page-title{font-size:2.2rem;}
body[data-font="xlarge"] .test-card-title{font-size:1.4rem;}
body[data-font="xlarge"] .test-card-desc{font-size:1.05rem;}
body[data-font="xlarge"] .quiz-question{font-size:1.42rem;}
body[data-font="xlarge"] .quiz-option-text{font-size:1.14rem;}
body[data-font="xlarge"] .quiz-hint,body[data-font="xlarge"] .nickname-label{font-size:1rem;}
body[data-font="xlarge"] .result-type-code{font-size:3rem;}
body[data-font="xlarge"] .result-type-name{font-size:1.7rem;}
body[data-font="xlarge"] .result-summary{font-size:1.15rem;}
body[data-font="xlarge"] .mode-switch-btn{font-size:1.05rem;}
body[data-font="xlarge"] .chart-card h4,body[data-font="xlarge"] .compare-col h3{font-size:1.2rem;}
body[data-font="xlarge"] .report-module h3{font-size:1.3rem;}
body[data-font="xlarge"] .report-module p,.report-module li{font-size:1.12rem;line-height:1.95;}
body[data-font="xlarge"] p.mod-p{font-size:1.13rem;line-height:2.1;}
body[data-font="xlarge"] .report-blockquote{font-size:1.12rem;line-height:2;}
body[data-font="xlarge"] .mod-subheading{font-size:1.16rem;}
body[data-font="xlarge"] .module-tip{font-size:1rem;}
body[data-font="xlarge"] .risk-callout{font-size:1.08rem;}
body[data-font="xlarge"] .risk-tag,body[data-font="xlarge"] .skipped-badge{font-size:.94rem;}
body[data-font="xlarge"] .btn{font-size:1.08rem;}
body[data-font="xlarge"] .btn-lg{font-size:1.2rem;}
body[data-font="xlarge"] .btn-sm{font-size:1rem;}
body[data-font="xlarge"] .nav-btn{font-size:1.06rem;}
body[data-font="xlarge"] .trait-chip{font-size:1rem;}
body[data-font="xlarge"] .history-item-title{font-size:1.16rem;}
body[data-font="xlarge"] .history-item-meta,.setting-desc{font-size:1rem;}
body[data-font="xlarge"] .data-section h3{font-size:1.35rem;}
body[data-font="xlarge"] .settings-group h3{font-size:1.3rem;}
body[data-font="xlarge"] .setting-name{font-size:1.1rem;}
body[data-font="xlarge"] .seg-btn{font-size:1.02rem;}
body[data-font="xlarge"] .overview-summary-card p{font-size:1.1rem;}
body[data-font="xlarge"] .footer-disclaimer{font-size:.98rem;}
body[data-font="xlarge"] .disclaimer{font-size:1.04rem;}
body[data-font="xlarge"] .empty-state-title{font-size:1.4rem;}
body[data-font="xlarge"] .empty-state-desc{font-size:1.08rem;}
body[data-font="xlarge"] .modal-title{font-size:1.4rem;}
body[data-font="xlarge"] .modal-body{font-size:1.1rem;}

body[data-anim="off"] *{animation:none !important;transition:none !important;}

/* ====== Scrollbar ====== */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary-light);}

/* ====== Utility Classes ====== */
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
.flex{display:flex;}.items-center{align-items:center;}.justify-center{justify-content:center;}
.justify-between{justify-content:space-between;}.flex-wrap{flex-wrap:wrap;}
.gap-sm{gap:12px;}.gap-md{gap:20px;}.gap-lg{gap:32px;}
.text-center{text-align:center;}.text-secondary{color:var(--text-secondary);}
.mt-sm{margin-top:12px;}.mt-md{margin-top:24px;}.mt-lg{margin-top:40px;}
.mb-sm{margin-bottom:12px;}.mb-md{margin-bottom:24px;}.mb-lg{margin-bottom:40px;}
.hidden{display:none !important;}.w-full{width:100%;}
.fade-in{animation:fadeIn .5s ease forwards;opacity:0;}
.slide-up{animation:slideUp .5s ease forwards;opacity:0;transform:translateY(20px);}
@keyframes fadeIn{to{opacity:1;}}
@keyframes slideUp{to{opacity:1;transform:translateY(0);}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.05);opacity:1;}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}
@keyframes particles{0%{transform:translate(0,0) scale(0);opacity:0;}50%{opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0;}}
@keyframes ripple{from{transform:scale(0);opacity:.5;}to{transform:scale(4);opacity:0;}}
@keyframes toastIn{from{transform:translateY(-80px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes toastOut{from{transform:translateY(0);opacity:1;}to{transform:translateY(-80px);opacity:0;}}
@keyframes modalIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ====== Navigation ====== */
.navbar{
  position:sticky;top:0;z-index:100;padding:12px 0;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:saturate(200%) blur(16px);-webkit-backdrop-filter:saturate(200%) blur(16px);
  border-bottom:1px solid transparent;transition:all var(--transition);
}
.navbar.scrolled{border-bottom-color:var(--border);box-shadow:var(--shadow-sm);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;}
.logo{
  display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;cursor:pointer;
  text-decoration:none;color:var(--text);transition:opacity var(--transition);
}
.logo:hover{opacity:.85;}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 60%,var(--mint) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 40%,transparent);
  transition:transform var(--transition-lg),box-shadow var(--transition-lg);
}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05);box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 50%,transparent);}
.nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.nav-btn{
  background:none;border:none;color:var(--text-secondary);cursor:pointer;
  padding:9px 14px;border-radius:11px;font-size:.88rem;font-weight:500;
  transition:all var(--transition);display:flex;align-items:center;gap:6px;
  min-height:38px;justify-content:center;position:relative;
}
.nav-btn:hover{color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,transparent);}
.nav-btn.active{
  color:#fff;font-weight:600;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:var(--shadow-primary);
}
.nav-btn:not(.active):active{transform:scale(.97);}
.theme-toggle{transition:transform var(--transition),color var(--transition),background var(--transition);border-radius:10px !important;}
.theme-toggle:hover{background:color-mix(in srgb,var(--primary) 10%,transparent) !important;color:var(--primary) !important;}
.theme-toggle:active{transform:rotate(180deg) scale(.92);}

/* ====== Buttons ====== */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border:none;border-radius:12px;cursor:pointer;
  font-size:.95rem;font-weight:600;min-height:48px;overflow:hidden;
  transition:all var(--transition-lg);text-decoration:none;font-family:inherit;
  letter-spacing:.01em;
}
.btn:focus{outline:2px solid var(--primary-light);outline-offset:3px;}
.btn:focus-visible{outline:2px solid var(--primary-light);outline-offset:3px;}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;filter:grayscale(.2);}
.btn-primary{
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
  color:#fff;box-shadow:var(--shadow-primary);
  background-size:150% 150%;background-position:0% 50%;
}
.btn-primary:hover:not(:disabled){
  transform:translateY(-2px);box-shadow:0 12px 32px rgba(91,108,255,.32);
  background-position:100% 50%;
}
.btn-primary:active:not(:disabled){transform:translateY(0) scale(.98);}
.btn-secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:var(--shadow-xs);}
.btn-secondary:hover:not(:disabled){
  border-color:var(--primary);color:var(--primary);
  transform:translateY(-1.5px);box-shadow:var(--shadow-md);
  background:color-mix(in srgb,var(--primary) 4%,var(--card));
}
.btn-secondary:active:not(:disabled){transform:translateY(0) scale(.99);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover:not(:disabled){color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,transparent);}
.btn-danger{background:linear-gradient(135deg,#EF6B7C,#D15568);color:#fff;box-shadow:0 4px 16px rgba(209,85,104,.28);}
.btn-danger:hover:not(:disabled){transform:translateY(-1.5px);box-shadow:0 8px 24px rgba(209,85,104,.36);}
.btn-block{width:100%;}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none;animation:ripple .65s ease-out;}
.btn-secondary .ripple,.btn-ghost .ripple{background:color-mix(in srgb,var(--primary) 25%,transparent);}
.btn-sm{padding:8px 14px;min-height:36px;font-size:.85rem;border-radius:9px;}
.btn-lg{padding:16px 32px;min-height:56px;font-size:1.05rem;border-radius:14px;}

/* ====== Cards ====== */
.card{
  background:var(--card);border-radius:var(--radius-lg);padding:28px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  transition:all var(--transition-lg);position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--mint));
  opacity:0;transition:opacity var(--transition-lg);
}
[data-theme="dark"] .card{
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
}
.card-hover:hover{transform:translateY(-7px);box-shadow:var(--shadow-hover);border-color:var(--border-strong);}
.card-hover:hover::before{opacity:.9;}

/* ====== Hero / Home ====== */
.hero{padding:80px 0 60px;position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;pointer-events:none;opacity:.35;overflow:hidden;}
.hero-bg::before{
  content:"";position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--primary) 22%,transparent) 0%,transparent 70%);
  filter:blur(40px);
}
.hero-bg .geo-symbol{position:absolute;animation:floatY 8s ease-in-out infinite;opacity:.7;}
.hero-bg .geo-symbol:nth-child(1){top:10%;left:8%;animation-delay:0s;}
.hero-bg .geo-symbol:nth-child(2){top:30%;right:12%;animation-delay:-2s;}
.hero-bg .geo-symbol:nth-child(3){bottom:20%;left:15%;animation-delay:-4s;}
.hero-bg .geo-symbol:nth-child(4){top:60%;right:18%;animation-delay:-6s;}
.hero-bg .geo-symbol:nth-child(5){bottom:10%;right:35%;animation-delay:-3s;}
.hero-inner{position:relative;z-index:1;text-align:center;max-width:820px;margin:0 auto;}
.hero-title{
  font-size:clamp(2.1rem,5.5vw,3.4rem);font-weight:800;line-height:1.18;letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 50%,var(--mint) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;transform:translateY(-16px);animation:slideUp .8s ease .1s forwards;
}
.hero-sub{font-size:1.12rem;color:var(--text-secondary);margin-top:22px;opacity:0;animation:fadeIn .8s ease .3s forwards;font-weight:500;}
.hero-desc{font-size:.96rem;color:var(--text-secondary);margin-top:14px;line-height:1.85;max-width:680px;margin-left:auto;margin-right:auto;opacity:0;animation:fadeIn .8s ease .45s forwards;}
.nickname-box{
  max-width:440px;margin:36px auto 0;padding:22px;background:var(--card);
  border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow-md);
  opacity:0;animation:slideUp .6s ease .55s forwards;
  transition:box-shadow var(--transition-lg),border-color var(--transition-lg);
}
.nickname-box:focus-within{box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--primary) 35%,var(--border));}
.nickname-label{font-size:.84rem;color:var(--text-secondary);margin-bottom:10px;text-align:left;font-weight:500;}
.nickname-input{
  width:100%;padding:13px 16px;border-radius:11px;
  border:1.5px solid var(--border);background:var(--bg-2);color:var(--text);
  font-size:1rem;font-family:inherit;transition:all var(--transition);
}
.nickname-input:hover{border-color:var(--border-strong);}
.nickname-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent);background:var(--card);}
.hero-cta{margin-top:32px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;opacity:0;animation:slideUp .6s ease .7s forwards;}

/* ====== Section Title ====== */
.section-title{font-size:1.65rem;font-weight:700;margin-bottom:8px;letter-spacing:-.005em;}
.section-sub{color:var(--text-secondary);margin-bottom:32px;font-size:.96rem;line-height:1.7;}

/* ====== Test Cards Grid ====== */
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;margin-top:20px;}
.test-card{
  padding:26px;cursor:pointer;opacity:0;transform:translateY(24px);
  display:flex;flex-direction:column;gap:14px;position:relative;
}
.test-card.show{animation:slideUp .55s ease forwards;}
.test-card-icon{
  width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 12%,transparent),color-mix(in srgb,var(--secondary) 14%,transparent));
  transition:all var(--transition-lg);
}
.test-card:hover .test-card-icon{transform:scale(1.06) rotate(-4deg);box-shadow:var(--shadow-sm);}
.test-card-title{font-size:1.18rem;font-weight:700;line-height:1.4;}
.test-card-desc{font-size:.92rem;color:var(--text-secondary);line-height:1.75;flex:1;}
.test-card-meta{display:flex;gap:16px;font-size:.82rem;color:var(--text-muted);padding-top:14px;border-top:1px dashed var(--border);}
.test-card-meta span{display:flex;align-items:center;gap:5px;font-weight:500;}

/* ====== Test Page (Quiz) ====== */
.quiz-wrap{max-width:800px;margin:0 auto;padding:40px 24px 80px;}
.quiz-header{margin-bottom:28px;}
.quiz-progress-wrap{margin:16px 0 10px;position:relative;}
.quiz-progress-bar{
  height:10px;background:var(--bg-2);border-radius:5px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.04);
}
.quiz-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary) 70%,var(--mint));
  border-radius:5px;width:0;transition:width .7s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 1px 6px color-mix(in srgb,var(--primary) 40%,transparent);
}
.quiz-progress-text{display:flex;justify-content:space-between;margin-top:10px;font-size:.88rem;color:var(--text-secondary);}
.quiz-progress-text strong{color:var(--primary);font-weight:700;}
.quiz-question-card{min-height:320px;}
.quiz-question{font-size:1.2rem;font-weight:600;line-height:1.75;margin-bottom:28px;}
.quiz-qnum{
  display:inline-block;color:#fff;font-weight:700;margin-right:12px;
  padding:4px 12px;border-radius:8px;font-size:.92rem;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 30%,transparent);
}
.quiz-options{display:flex;flex-direction:column;gap:12px;}
.quiz-option{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;
  border:2px solid var(--border);background:var(--bg-2);cursor:pointer;
  transition:all var(--transition-lg);position:relative;min-height:60px;user-select:none;
}
.quiz-option:hover{
  border-color:color-mix(in srgb,var(--primary) 50%,var(--border));
  background:color-mix(in srgb,var(--primary) 6%,var(--bg-2));
  transform:translateX(4px);
}
.quiz-option.selected{
  border-color:var(--primary);
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 14%,var(--card)),color-mix(in srgb,var(--secondary) 10%,var(--card)));
  transform:translateX(2px);box-shadow:var(--shadow-sm);
}
.quiz-option.selected::after{
  content:"";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:0 2px 10px color-mix(in srgb,var(--primary) 45%,transparent);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>"),
    linear-gradient(135deg,var(--primary),var(--secondary));
  background-size:14px,cover;background-position:center,center;background-repeat:no-repeat;
  animation:pulse .3s ease;
}
.quiz-option-radio{
  width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border-strong);flex-shrink:0;position:relative;
  transition:all var(--transition-lg);background:var(--card);
}
.quiz-option.selected .quiz-option-radio{
  border-color:var(--primary);
  background:radial-gradient(circle,var(--primary) 0%,var(--primary) 40%,transparent 42%);
}
.quiz-option-text{font-size:.98rem;line-height:1.55;font-weight:500;}
.quiz-footer{margin-top:32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.quiz-hint{font-size:.85rem;color:var(--text-secondary);margin-top:14px;padding:14px 18px;background:var(--bg-2);border-radius:12px;border-left:4px solid var(--primary);line-height:1.7;}
.question-area{transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1);}
.question-area.switching{opacity:0;transform:translateX(18px);}
.skipped-badge{display:inline-block;padding:3px 10px;border-radius:6px;background:#FEF3C7;color:#92400E;font-size:.78rem;font-weight:700;margin-left:8px;}
[data-theme="dark"] .skipped-badge{background:#92400E;color:#FEF3C7;}

/* ====== Results Page ====== */
.result-wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
.result-header{text-align:center;margin-bottom:36px;}
.result-type-code{font-size:2.7rem;font-weight:800;letter-spacing:3px;line-height:1.1;
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 50%,var(--mint) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px color-mix(in srgb,var(--primary) 20%,transparent);
}
.result-type-name{font-size:1.5rem;font-weight:700;margin-top:8px;letter-spacing:.02em;}
.result-summary{font-size:1.02rem;color:var(--text-secondary);margin-top:16px;line-height:1.88;max-width:640px;margin-left:auto;margin-right:auto;font-weight:450;}
.result-illustration{width:260px;height:280px;margin:20px auto 0;overflow:hidden;border-radius:18px;}
.result-illustration svg{width:100% !important;height:100% !important;}
.mode-switch{
  display:inline-flex;padding:5px;background:var(--bg-2);border-radius:14px;
  border:1px solid var(--border);margin-top:24px;box-shadow:var(--shadow-xs);
}
.mode-switch-btn{
  padding:11px 22px;border:none;background:transparent;cursor:pointer;border-radius:10px;
  font-size:.92rem;font-weight:600;color:var(--text-secondary);transition:all var(--transition-lg);
  min-height:42px;
}
.mode-switch-btn.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px);}
.report-area{transition:opacity .45s ease;}
.report-area.switching{opacity:0;}

/* ====== Charts ====== */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0;}
@media(max-width:760px){.charts-grid{grid-template-columns:1fr;}}
.chart-card h4{font-size:1.02rem;font-weight:700;margin-bottom:20px;letter-spacing:.005em;}
.bar-row{margin-bottom:16px;}
.bar-label{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:8px;}
.bar-label strong{font-weight:650;color:var(--text);}
.bar-track{height:11px;background:var(--bg-2);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.04);}
.bar-fill{height:100%;border-radius:6px;width:0;transition:width 1.3s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,var(--primary),var(--secondary) 65%,var(--mint));box-shadow:0 1px 5px color-mix(in srgb,var(--primary) 30%,transparent);}

/* ====== Report Modules ====== */
.report-modules{display:flex;flex-direction:column;gap:22px;margin-top:32px;}
.report-module{padding:28px;}
.report-module h3{
  display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:700;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px solid var(--border);letter-spacing:-.002em;color:var(--text);
}
.report-module h3 .module-icon{flex-shrink:0;}
.module-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--secondary) 16%,transparent));
  color:var(--primary);font-weight:700;
}
.report-module p,.report-module li{font-size:.95rem;line-height:1.9;color:var(--text-secondary);}
.report-module ul{padding-left:20px;display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.trait-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;margin-top:12px;}
.trait-chip{
  padding:10px 16px;border-radius:999px;font-size:.86rem;text-align:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 14%,transparent),color-mix(in srgb,var(--secondary) 10%,transparent));
  color:var(--primary);font-weight:600;border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);
  transition:all var(--transition-lg);
}
.trait-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.action-list{list-style:none;padding:0 !important;}
.action-list li{
  padding:14px 18px;background:var(--bg-2);border-radius:12px;
  border-left:4px solid var(--primary);margin:0 !important;
  transition:all var(--transition-lg);font-weight:450;
}
.action-list li:hover{background:color-mix(in srgb,var(--primary) 6%,var(--bg-2));transform:translateX(3px);}
.risk-tag{display:inline-block;padding:4px 11px;border-radius:7px;
  background:linear-gradient(135deg,#fecaca,#fee2e2);color:#991b1b;font-size:.78rem;font-weight:700;
  border:1px solid color-mix(in srgb,#991b1b 20%,transparent);
}
[data-theme="dark"] .risk-tag{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fecaca;border-color:color-mix(in srgb,#fecaca 20%,transparent);}

.report-module p.mod-p{
  text-indent:2em;line-height:1.95;margin:0 0 16px;color:var(--text-secondary);font-size:.97rem;
}
.report-module p.mod-p:last-child{margin-bottom:0;}
.mod-subheading{
  font-weight:700;font-size:1rem;color:var(--primary);margin:20px 0 10px;
  padding-left:12px;border-left:4px solid var(--primary);line-height:1.45;
}
.report-blockquote{
  margin:18px 0 20px;padding:18px 22px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 12%,transparent),color-mix(in srgb,var(--secondary) 15%,transparent));
  border-left:4px solid var(--primary);
  color:var(--text);font-size:.97rem;line-height:1.9;font-weight:500;
  quotes:"\201C""\201D";
  box-shadow:var(--shadow-xs);
}
.report-blockquote::before{content:open-quote;color:var(--primary);font-size:2rem;line-height:0;margin-right:6px;vertical-align:-.45rem;font-family:serif;}
[data-theme="dark"] .report-blockquote{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 24%,transparent),color-mix(in srgb,var(--secondary) 28%,transparent));}
.module-tip{
  margin-top:20px;padding:12px 18px;border-radius:999px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 20%,transparent),color-mix(in srgb,#4FC3A7 10%,transparent));
  color:color-mix(in srgb,var(--mint) 95%,#143d35);
  display:inline-flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;line-height:1.55;
  border:1px solid color-mix(in srgb,var(--mint) 25%,transparent);
}
[data-theme="dark"] .module-tip{color:#d5f3ec;background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 32%,transparent),color-mix(in srgb,#4FC3A7 18%,transparent));}
.module-tip::before{content:"💡";font-size:1rem;}
.risk-callout{
  margin:16px 0;padding:16px 20px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in srgb,#c95568 12%,transparent),color-mix(in srgb,#c95568 8%,transparent));
  border-left:4px solid #c95568;color:var(--text);font-size:.94rem;line-height:1.85;
  box-shadow:var(--shadow-xs);
}
[data-theme="dark"] .risk-callout{background:linear-gradient(135deg,color-mix(in srgb,#c95568 22%,transparent),color-mix(in srgb,#c95568 16%,transparent));}

.result-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:44px;}

/* ====== History / Overview / Comparison / Advice / Data / Settings Pages ====== */
.page-wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px;}
.page-header{margin-bottom:32px;}
.page-title{font-size:1.85rem;font-weight:800;margin-bottom:8px;letter-spacing:-.005em;}
.page-sub{color:var(--text-secondary);font-size:.96rem;line-height:1.7;}

.history-list{display:flex;flex-direction:column;gap:14px;}
.history-item{
  padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  transition:all var(--transition-lg);
}
.history-item:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);transform:translateY(-2px);}
.history-item-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 20%,transparent),color-mix(in srgb,var(--secondary) 20%,transparent));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-xs);
}
.history-item-main{flex:1;min-width:200px;}
.history-item-title{font-weight:650;font-size:1.02rem;line-height:1.4;}
.history-item-meta{font-size:.85rem;color:var(--text-secondary);margin-top:5px;line-height:1.6;}
.history-item-actions{display:flex;gap:8px;flex-wrap:wrap;}
.compare-checkbox{width:20px;height:20px;cursor:pointer;accent-color:var(--primary);transform:scale(1.05);}

/* Overview */
.overview-summary-card{
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 14%,transparent),color-mix(in srgb,var(--secondary) 12%,transparent),color-mix(in srgb,var(--mint) 10%,transparent));
  padding:36px;border-radius:22px;margin-bottom:28px;text-align:center;box-shadow:var(--shadow-sm);
}
.tag-cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;}
.tag-chip{
  padding:9px 18px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  font-size:.88rem;color:var(--text);font-weight:500;box-shadow:var(--shadow-xs);
  transition:all var(--transition-lg);
}
.tag-chip:hover{transform:translateY(-2px) scale(1.03);box-shadow:var(--shadow);border-color:var(--border-strong);}

/* Data Management */
.data-section{margin-bottom:34px;}
.data-section h3{font-size:1.18rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;letter-spacing:-.002em;}
.data-card{padding:24px;display:flex;flex-direction:column;gap:16px;}
.data-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* Settings */
.settings-group{margin-bottom:30px;}
.settings-group h3{font-size:1.12rem;font-weight:700;margin-bottom:16px;letter-spacing:-.002em;}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;background:var(--card);border-radius:14px;
  border:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap;gap:14px;
  transition:all var(--transition-lg);
}
.setting-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
.setting-info{flex:1;min-width:220px;}
.setting-name{font-weight:650;font-size:.96rem;line-height:1.4;}
.setting-desc{font-size:.83rem;color:var(--text-secondary);margin-top:4px;line-height:1.6;}
.seg-control{display:inline-flex;padding:4px;background:var(--bg-2);border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-xs);}
.seg-btn{
  padding:9px 18px;border:none;background:transparent;cursor:pointer;border-radius:8px;
  font-size:.86rem;font-weight:500;color:var(--text-secondary);min-height:38px;transition:all var(--transition-lg);
}
.seg-btn.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow);font-weight:650;transform:translateY(-1px);}

/* Switch toggle */
.switch{position:relative;width:52px;height:30px;display:inline-block;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-slider{
  position:absolute;inset:0;background:var(--border-strong);border-radius:30px;
  cursor:pointer;transition:all var(--transition-lg);
}
.switch-slider::before{
  content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:all var(--transition-lg);
  box-shadow:0 3px 8px rgba(0,0,0,.22);
}
.switch input:checked+.switch-slider{background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 2px 10px color-mix(in srgb,var(--primary) 45%,transparent);}
.switch input:checked+.switch-slider::before{transform:translateX(22px);}

/* Empty State */
.empty-state{
  text-align:center;padding:70px 30px;
}
.empty-state-icon{
  width:112px;height:112px;margin:0 auto 24px;border-radius:32px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--secondary) 14%,transparent));
  color:var(--primary);box-shadow:var(--shadow-sm);
}
.empty-state-title{font-size:1.28rem;font-weight:700;margin-bottom:10px;letter-spacing:-.003em;}
.empty-state-desc{color:var(--text-secondary);font-size:.96rem;margin-bottom:28px;line-height:1.75;max-width:480px;margin-left:auto;margin-right:auto;}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,color-mix(in srgb,var(--border) 55%,transparent) 50%,var(--border) 75%);
  background-size:200% 100%;animation:skeleton 1.4s infinite;border-radius:10px;}
@keyframes skeleton{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skeleton-line{height:16px;margin-bottom:12px;}
.skeleton-title{height:28px;margin-bottom:18px;}

/* Toast */
.toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast{
  padding:14px 24px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  box-shadow:0 10px 32px rgba(17,24,39,.18);font-size:.93rem;font-weight:500;
  min-width:250px;max-width:440px;display:flex;align-items:center;gap:12px;
  pointer-events:auto;animation:toastIn .4s cubic-bezier(.22,1,.36,1);line-height:1.5;
}
.toast.out{animation:toastOut .3s ease forwards;}
.toast-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem;box-shadow:var(--shadow-xs);}
.toast-success .toast-icon{background:linear-gradient(135deg,#6EE7B7,#34D399);color:#064E3B;}
.toast-error .toast-icon{background:linear-gradient(135deg,#FCA5A5,#F87171);color:#7F1D1D;}
.toast-info .toast-icon{background:linear-gradient(135deg,#93C5FD,#60A5FA);color:#1E3A8A;}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:900;display:flex;align-items:center;justify-content:center;
  padding:20px;animation:fadeIn .3s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal{
  background:var(--card);border-radius:20px;padding:30px;max-width:480px;width:100%;
  border:1px solid var(--border);box-shadow:0 28px 72px rgba(17,24,39,.28);
  animation:modalIn .35s cubic-bezier(.22,1,.36,1);
}
.modal-title{font-size:1.25rem;font-weight:700;margin-bottom:12px;letter-spacing:-.003em;}
.modal-body{color:var(--text-secondary);line-height:1.85;margin-bottom:24px;font-size:.96rem;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* Disclaimer */
.disclaimer{
  margin-top:64px;padding:22px 26px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 14%,transparent),color-mix(in srgb,#4FC3A7 8%,transparent));
  border-radius:16px;border-left:4px solid var(--mint);font-size:.9rem;
  color:var(--text-secondary);line-height:1.85;box-shadow:var(--shadow-xs);
}
.disclaimer strong{color:var(--text);font-weight:700;}
.footer-disclaimer{
  margin-top:44px;padding:28px;text-align:center;font-size:.82rem;color:var(--text-secondary);
  border-top:1px solid var(--border);line-height:1.85;
}

/* Comparison */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:760px){.compare-grid{grid-template-columns:1fr;}}
.compare-col h3{font-size:1.08rem;font-weight:700;margin-bottom:16px;text-align:center;}
.compare-bar-row{margin-bottom:14px;}
.compare-bar-label{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:6px;line-height:1.5;}

/* Particles */
.particles-container{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.particle{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;animation:particles 1.7s ease-out forwards;}

/* ====== Print Styles ====== */
@media print{
  body{background:#fff !important;color:#000 !important;--bg:#fff !important;--card:#fff !important;--text:#000 !important;--text-secondary:#333 !important;--border:#ddd !important;}
  .navbar,.result-actions,.mode-switch,.hero-cta,.data-actions,.history-item-actions,
  .nav-links,.btn,.toast-wrap,.modal-backdrop,.particles-container,.page-wrap > .btn,
  .quiz-footer{display:none !important;}
  *{animation:none !important;transition:none !important;box-shadow:none !important;}
  .card,.report-module,.setting-row{break-inside:avoid;border-color:#ddd !important;padding:16px !important;}
  .container,.page-wrap,.result-wrap,.quiz-wrap{max-width:100% !important;padding:10px !important;}
  .result-illustration{width:160px !important;height:175px !important;}
  .charts-grid{grid-template-columns:1fr 1fr !important;}
  .report-module h3{border-bottom-color:#ddd !important;}
}

/* ====== Responsive ====== */
@media(max-width:640px){
  .hero{padding:48px 0 40px;}
  .nav-btn{padding:8px 10px;font-size:.82rem;}
  .logo span{font-size:.95rem;}
  .container{padding:0 16px;}
  .page-wrap,.result-wrap,.quiz-wrap{padding:28px 16px 60px;}
  .test-grid{grid-template-columns:1fr;gap:16px;}
  .card{padding:20px;}
  .report-module{padding:18px;}
  .btn{padding:11px 16px;min-height:44px;font-size:.88rem;}
  .result-type-code{font-size:1.9rem;}
  .quiz-option{padding:14px;}
}
</style>

/* ============ 4. STORAGE LAYER (with corruption resilience) ============ */
const STORAGE_KEY = "meta_test_hub";
const Store = {
  defaultData(){
    return {
      settings:{theme:"light",animations:true,fontSize:"standard",nickname:"",reportMode:"brief"},
      progress:{}, /* {testId: {index:0, answers:[...]}} */
      history:[],  /* [{id, testId, testShort, typeName, typeCode, nickname, timestamp, scores, dims, answers}] */
      compare:[],  /* selected history ids for comparison */
      schema:1,
    };
  },
  _safeParse(raw){
    try{
      if(!raw || typeof raw !== "string") return null;
      const d = JSON.parse(raw);
      if(!d || typeof d !== "object") return null;
      return d;
    }catch(e){ return null; }
  },
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    const dflt = this.defaultData();
    const obj = this._safeParse(raw);
    if(!obj){
      // attempt silent recovery: write fresh default
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(dflt)); }catch(e){}
      return dflt;
    }
    // migrate/merge missing keys (forward compat)
    const out = {...dflt, ...obj};
    out.settings = {...dflt.settings, ...(obj.settings||{})};
    out.progress = obj.progress||{};
    out.history = Array.isArray(obj.history)?obj.history:[];
    out.compare = Array.isArray(obj.compare)?obj.compare:[];
    // coerce booleans
    if(typeof out.settings.animations !== "boolean") out.settings.animations = true;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(out)); }catch(e){}
    return out;
  },
  save(data){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    }catch(e){
      App.toast("数据写入失败：浏览器存储空间不足或受限","error");
      return false;
    }
  },
  clearAll(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  },
  /* Corruption rescue: wipe tainted localStorage only for our key. */
  rescue(){
    try{
      localStorage.removeItem(STORAGE_KEY);
      const fresh = this.defaultData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }catch(e){ return this.defaultData(); }
  }
};

/* ============ 5. SCORING ENGINES ============ */
/* Compute raw scores per dimension key, applying reverse scoring. 
   answers: Array<number|null> length q.length  (1..5 or null for skipped) */
function rawScores(questions, answers){
  const out = {};
  for(let i=0;i<questions.length;i++){
    const a = answers[i];
    if(a==null || a<1 || a>5) continue; // skip unanswered
    const q = questions[i];
    const score = q.r ? (6-a) : a;
    if(!out[q.d]) out[q.d]=0;
    out[q.d] += score;
  }
  return out;
}

/* Count answered per dimension (for pct normalization) */
function countPerDim(questions, answers){
  const out = {};
  for(let i=0;i<questions.length;i++){
    if(answers[i]!=null){
      const d = questions[i].d;
      if(!out[d]) out[d]=0;
      out[d]++;
    }
  }
  return out;
}

/* Convert raw -> dimension percent (0..100) assuming 5-point max per question */
function dimPercents(questions, answers){
  const raw = rawScores(questions, answers);
  const counts = countPerDim(questions, answers);
  const out = {};
  Object.keys(raw).forEach(k=>{
    const max = (counts[k]||0) * 5;
    out[k] = max>0 ? Math.round( (raw[k]/max)*100 ) : 50;
  });
  return out;
}

function scoreMBTI(answers){
  const q = TESTS.mbti.builder();
  const raw = rawScores(q, answers);
  const dims = {};
  const pairs = TESTS.mbti.pairs;
  let code="";
  pairs.forEach(([a,b])=>{
    const sa = raw[a]||0, sb = raw[b]||0;
    const total = sa+sb || 1;
    const pa = Math.round((sa/total)*100);
    const pb = 100 - pa;
    dims[a] = pa; dims[b] = pb;
    code += sa >= sb ? a : b;
  });
  const info = MBTI_TYPES[code] || {name:"未知型",group:"待定阵营",summary:"综合人格倾向尚未形成稳定模式。"};
  return {
    code, name:info.name, group:info.group,
    summary:info.summary,
    scores:raw, dims,
  };
}

function scoreSimple(testId, answers){
  const q = TESTS[testId].builder();
  const dims = dimPercents(q, answers);
  // determine type
  let typeName="", code="", summary="";
  if(testId==="element"){
    const ranks = Object.entries(dims).sort((a,b)=>b[1]-a[1]);
    const top = ranks[0][0];
    const nameMap = {fire:"火型气质",earth:"土型气质",air:"风型气质",water:"水型气质"};
    const sumMap = {
      fire:"行动如风、充满热情的能量驱动者，善于点燃气氛、推动事物前进。",
      earth:"沉稳踏实、可信赖的现实基石，注重稳定、责任与长期耕耘。",
      air:"思维敏捷、好奇求知的沟通者，善于连接想法、多角度看问题。",
      water:"细腻共情、富有直觉的感受者，关注情感深度与内心世界。",
    };
    typeName = nameMap[top]; code = top.toUpperCase();
    summary = sumMap[top];
  }else if(testId==="ocean"){
    const h = Object.entries(dims);
    code = h.map(([k,v])=> v>=60?"H":(v<=40?"L":"M")).join("");
    typeName = "OCEAN人格画像";
    const highs = h.filter(x=>x[1]>=60).map(x=>TESTS.ocean.axes.find(a=>a.k===x[0]).name.split(" ")[0]);
    summary = highs.length>0 ? `你的显著特质为：${highs.join("、")}，这些维度塑造了你的核心行为倾向。` : "各维度分布相对均衡，表现为稳定的适应性人格。";
  }else if(testId==="ecr"){
    const a = dims.anx||50, v = dims.avo||50;
    if(a<50 && v<50){ typeName="安全型"; code="SEC"; summary="在关系中既不担心被抛弃，也能自然地与对方亲近，是健康的依恋基础。"; }
    else if(a>=50 && v<50){ typeName="焦虑型"; code="ANX"; summary="渴望亲密却时常担心对方不够在乎，情绪易受关系波动影响。"; }
    else if(a<50 && v>=50){ typeName="回避型"; code="DIS"; summary="过度重视独立，对亲密感到束缚，习惯用距离保护自己。"; }
    else { typeName="恐惧-回避型"; code="FEA"; summary:"既渴望亲密又害怕受伤，常在靠近与逃离间反复摇摆。"; }
  }else if(testId==="holland"){
    const top3 = Object.entries(dims).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
    code = top3.join("");
    const nameMap = {R:"现实型",I:"研究型",A:"艺术型",S:"社会型",E:"企业型",C:"常规型"};
    typeName = top3.map(k=>nameMap[k]).join("·");
    summary = `霍兰德兴趣前三位为：${top3.map(k=>nameMap[k]).join("、")}，你的职业兴趣组合指向特定领域的潜能方向。`;
  }else if(testId==="vark"){
    const ranked = Object.entries(dims).sort((a,b)=>b[1]-a[1]);
    const top = ranked[0][0];
    const nameMap = {V:"视觉型学习者",A:"听觉型学习者",R:"读/写型学习者",K:"动觉型学习者"};
    const sumMap = {
      V:"通过图表、图像、思维导图等视觉载体吸收效率最高。",
      A:"通过听课、讨论、音频等听觉通道吸收效率最高。",
      R:"通过阅读、记笔记、写要点吸收效率最高。",
      K:"通过动手做、实验、模拟实践吸收效率最高。",
    };
    code = ranked.map(x=>x[0]).join("");
    typeName = nameMap[top];
    summary = sumMap[top];
  }
  return {code, name:typeName, summary, dims, scores:rawScores(q,answers)};
}

function scoreTest(testId, answers){
  if(testId==="mbti") return scoreMBTI(answers);
  return scoreSimple(testId, answers);
}

    const onScroll = ()=>{
      const y = window.scrollY;
      if(y>8) nav.classList.add("scrolled");
      else nav.classList.remove("scrolled");
      if(backTop){
        if(y>420) backTop.classList.add("show");
        else backTop.classList.remove("show");
      }
    };
    onScroll();
    window.addEventListener("scroll",onScroll,{passive:true});
    if(backTop){
      backTop.addEventListener("click",()=>{
        window.scrollTo({top:0, behavior:this.state.settings.animations?"smooth":"auto"});
        this.toast("已回到顶部","info",1600);
      });
    }
    // theme button
    document.getElementById("themeToggleBtn").addEventListener("click",()=>this.toggleTheme());
    // nav route buttons
    document.querySelectorAll(".nav-btn[data-route]").forEach(b=>{
      b.addEventListener("click",()=>{
        const r = b.getAttribute("data-route");
        this.route(r);
      });
    });
    // ripple buttons (dynamic, delegated)
    document.addEventListener("click",(e)=>{
      const btn = e.target.closest(".btn");
      if(!btn || btn.disabled) return;
      this.addRipple(btn, e);
    });
    // import file
    document.getElementById("importFileInput").addEventListener("change",(e)=>{
      const f = e.target.files[0];
      e.target.value="";
      if(!f) return;
      this.importBackup(f);
    });
  },
  addRipple(btn, evt){
    const rect = btn.getBoundingClientRect();
    const r = document.createElement("span");
    r.className="ripple";
    const s = Math.max(rect.width, rect.height);
    const x = (evt.clientX||(rect.left+rect.width/2)) - rect.left - s/2;
    const y = (evt.clientY||(rect.top+rect.height/2)) - rect.top - s/2;
    r.style.width = r.style.height = s+"px";
    r.style.left = x+"px"; r.style.top = y+"px";
    btn.appendChild(r);
    setTimeout(()=>r.remove(), 650);
  },
  route(page, params){
    if(!params) params = {};
    const qs = Object.entries(params).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&");
    location.hash = `#/${page}${qs?("?"+qs):""}`;
  },
  parseRoute(){
    const h = location.hash.replace(/^#\//,"");
    const [path, query=""] = h.split("?");
    const params = {};
    query.split("&").filter(Boolean).forEach(kv=>{
      const [k,v] = kv.split("=");
      params[decodeURIComponent(k)] = decodeURIComponent(v||"");
    });
    return {page: path||"home", params};
  },
  handleRoute(){
    // highlight nav
    document.querySelectorAll(".nav-btn[data-route]").forEach(b=>b.classList.remove("active"));
    window.scrollTo({top:0,behavior:this.state.settings.animations?"smooth":"auto"});
    const {page, params} = this.parseRoute();
    // update active nav
    const navMap = {home:true,select:true,overview:true,history:true,advice:true,data:true,settings:true};
    if(navMap[page]){
      const b = document.querySelector(`.nav-btn[data-route="${page}"]`);
      if(b) b.classList.add("active");
    }
    switch(page){
      case "home": return this.renderHome();
      case "select": return this.renderSelect();
      case "quiz": return this.renderQuiz(params.testId);
      case "result": return this.renderResult(params.id);
      case "overview": return this.renderOverview();
      case "history": return this.renderHistory();
      case "compare": return this.renderCompare();
      case "advice": return this.renderAdvice();
      case "data": return this.renderData();
      case "settings": return this.renderSettings();
      default: return this.renderHome();
    }
  },
  /* =================== Toast & Modal =================== */
  toast(msg, type="info", duration=3000){
    const wrap = document.getElementById("toastWrap");
    const el = document.createElement("div");
    el.className = "toast toast-"+type;
    const iconHTML = type==="success"? ICONS.check : type==="error"? ICONS.x : ICONS.info;
    el.innerHTML = `<span class="toast-icon">${iconHTML}</span><span>${msg}</span>`;
    wrap.appendChild(el);
    setTimeout(()=>{
      el.classList.add("out");
      setTimeout(()=>el.remove(), 320);
    }, duration);

  confirmModal({title, body, confirmText="确认", cancelText="取消", danger=false, onConfirm}){
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-title">${title}</div>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">
          <button class="btn btn-secondary" data-act="cancel">${cancelText}</button>
          <button class="btn ${danger?"btn-danger":"btn-primary"}" data-act="ok">${confirmText}</button>
        </div>
      </div>`;
    backdrop.addEventListener("click",(e)=>{
      if(e.target===backdrop || e.target.getAttribute("data-act")==="cancel"){
        backdrop.remove();
      }else if(e.target.getAttribute("data-act")==="ok"){
        backdrop.remove();
        if(onConfirm) onConfirm();
      }
    });
    document.body.appendChild(backdrop);
  },
  /* launch celebration particles */
  celebrateParticles(opts){
    if(!this.state.settings.animations) return;
    const opts0 = opts || {};
    const intensity = opts0.intensity || 48;
    const origin = opts0.origin || null; // {clientX, clientY}
    const box = document.getElementById("particlesContainer");
    if(!box) return;
    const colors = ["#4f6ad2","#9482d1","#68b8a6","#e06b96","#e0a84f","#87a4ff","#ff9e76"];
    let ox = window.innerWidth/2, oy = window.innerHeight/2;
    if(origin){ ox = origin.clientX; oy = origin.clientY; }
    for(let i=0;i<intensity;i++){
      const p = document.createElement("span");
      p.className="particle";
      const ang = (Math.PI*2)*Math.random();
      const dist = 60 + Math.random()*280;
      const size = 4 + Math.random()*6;
      p.style.left = ox + "px";
      p.style.top = oy + "px";
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.setProperty("--tx",(Math.cos(ang)*dist)+"px");
      p.style.setProperty("--ty",(Math.sin(ang)*dist)+"px");
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = (Math.random()*.2)+"s";
      box.appendChild(p);
      setTimeout(()=>p.remove(),1900);
    }
  },

  /* =================== QUIZ FLOW =================== */
  quizState: null,
  startQuiz(testId){
    const test = TESTS[testId];
    if(!test) return;
    // resume or create
    let prog = this.state.progress[testId];
    const qCount = test.count;
    if(!prog || !Array.isArray(prog.answers) || prog.answers.length !== qCount){
      prog = { index:0, answers: new Array(qCount).fill(null) };
      this.state.progress[testId] = prog;
    }
    Store.save(this.state);
    this.route("quiz", {testId});
  },
  renderQuiz(testId){
    const test = TESTS[testId];
    if(!test){ this.route("select"); return; }
    let prog = this.state.progress[testId];
    if(!prog || prog.answers.length !== test.count){
      prog = {index:0, answers:new Array(test.count).fill(null)};
      this.state.progress[testId] = prog; Store.save(this.state);
    }
    const qs = test.builder();
    this.view.innerHTML = `
    <section class="quiz-wrap">
      <div class="quiz-header">
        <h2 style="font-size:1.3rem;font-weight:700;">${test.name}</h2>

          <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progressFill"></div></div>
          <div class="quiz-progress-text">
            <span id="progressLabel">第 ${prog.index+1} / ${test.count} 题</span>
            <span id="answeredLabel">已作答 ${prog.answers.filter(x=>x!=null).length} / ${test.count}</span>
          </div>
        </div>
      </div>

        <div class="question-area" id="questionArea">
          <div class="quiz-question"><span class="quiz-qnum" id="qNum">Q${prog.index+1}.</span><span id="qText"></span></div>
          <div class="quiz-options" id="qOptions"></div>
          ${prog.answers[prog.index]==null && this._wasSkipped(testId, prog.index)? `<div class="quiz-hint mt-md">${ICONS.warn} 本题已标记未作答，完成其他题目后可返回补答。</div>`:""}
        </div>
        <div class="quiz-footer">
          <button class="btn btn-secondary" id="btnPrev">${ICONS.left} 上一题</button>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-ghost" id="btnSkip">跳过本题</button>
            <button class="btn btn-ghost" id="btnExit">${ICONS.save} 保存并退出</button>
            <button class="btn btn-primary" id="btnNext">下一题 ${ICONS.right}</button>
          </div>
        </div>
        <div class="quiz-hint mt-md">
          ${ICONS.info} 请根据你的真实想法选择；系统将自动实时保存进度，关闭页面可从断点继续；支持跳过，提交前会提示未作答题目。
        </div>
      </div>
    </section>`;
    this._skipped = {};
    this._renderQuestion(testId);
    this._updateProgress(testId);
    document.getElementById("btnPrev").addEventListener("click",()=>this._prevQ(testId));
    document.getElementById("btnNext").addEventListener("click",()=>this._nextOrSubmit(testId));
    document.getElementById("btnSkip").addEventListener("click",()=>this._skipQ(testId));
    document.getElementById("btnExit").addEventListener("click",()=>this._exitQuiz(testId));
  },
  _wasSkipped(testId, idx){ return !!((this._skipped&&this._skipped[testId])||{})[idx]; },
  _renderQuestion(testId){
    const test = TESTS[testId];
    const qs = test.builder();
    const prog = this.state.progress[testId];
    const i = prog.index;
    document.getElementById("qNum").textContent = `Q${i+1}.`;
    document.getElementById("qText").textContent = qs[i].t;
    const optsEl = document.getElementById("qOptions");
    optsEl.innerHTML = "";
    const selected = prog.answers[i];
    LIKERT5.forEach(opt=>{
      const d = document.createElement("div");
      d.className = "quiz-option" + (selected===opt.value?" selected":"");
      d.setAttribute("role","radio"); d.setAttribute("tabindex","0");
      d.setAttribute("aria-checked", selected===opt.value?"true":"false");
      d.innerHTML = `<div class="quiz-option-radio"></div><div class="quiz-option-text">${opt.value}. ${opt.label}</div>`;
      const act = (e)=>{
        e.preventDefault();
        if(this._qLocked) return;
        this._qLocked = true;
        prog.answers[i] = opt.value;
        if(!this._skipped[testId]) this._skipped[testId]={};
        this._skipped[testId][i] = false;
        Store.save(this.state);
        // Update visuals without full re-render for better UX
        optsEl.querySelectorAll(".quiz-option").forEach((el,idx)=>{
          el.classList.toggle("selected", idx===LIKERT5.indexOf(opt));
          el.setAttribute("aria-checked", idx===LIKERT5.indexOf(opt)?"true":"false");
        });
        this._updateProgress(testId);
        setTimeout(()=>{ this._qLocked=false; }, 220);
      };
      d.addEventListener("click",act);
      d.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" ") act(e); });
      optsEl.appendChild(d);
    });
    // button state
    document.getElementById("btnPrev").disabled = prog.index===0;
    const nextBtn = document.getElementById("btnNext");
    if(prog.index === test.count-1){
      nextBtn.innerHTML = `提交答卷 ${ICONS.check}`;
    }else{
      nextBtn.innerHTML = `下一题 ${ICONS.right}`;
    }
  },
  _updateProgress(testId){
    const test = TESTS[testId];
    const prog = this.state.progress[testId];
    const pct = ((prog.index+1)/test.count)*100;
    const pf = document.getElementById("progressFill");
    if(pf) pf.style.width = pct+"%";
    const pl = document.getElementById("progressLabel");
    if(pl) pl.textContent = `第 ${prog.index+1} / ${test.count} 题`;
    const al = document.getElementById("answeredLabel");
    if(al) al.textContent = `已作答 ${prog.answers.filter(x=>x!=null).length} / ${test.count}`;
  },
  _prevQ(testId){
    const prog = this.state.progress[testId];
    if(prog.index<=0) return;
    this._switchQ(testId, prog.index-1);
  },
  _nextOrSubmit(testId){
    const test = TESTS[testId];
    const prog = this.state.progress[testId];
    if(prog.answers[prog.index]==null){
      // auto-skip flag for user clarity, but still allow advance
      if(!this._skipped[testId]) this._skipped[testId]={};
      this._skipped[testId][prog.index]=true;
    }
    if(prog.index === test.count-1){
      this._trySubmit(testId);
    }else{
      this._switchQ(testId, prog.index+1);
    }
  },
  _skipQ(testId){
    const test = TESTS[testId];
    const prog = this.state.progress[testId];
    if(!this._skipped[testId]) this._skipped[testId]={};
    this._skipped[testId][prog.index]=true;
    if(prog.index === test.count-1){
      this._trySubmit(testId);
    }else{
      this._switchQ(testId, prog.index+1);
    }
  },
  _switchQ(testId, newIdx){
    const prog = this.state.progress[testId];
    const area = document.getElementById("questionArea");
    if(!area){ prog.index=newIdx; Store.save(this.state); this._renderQuestion(testId); this._updateProgress(testId); return; }
    area.classList.add("switching");
    setTimeout(()=>{
      prog.index = newIdx;
      Store.save(this.state);
      this._renderQuestion(testId);
      this._updateProgress(testId);
      requestAnimationFrame(()=> area.classList.remove("switching"));
    }, 300);
  },
  _exitQuiz(testId){
    this.confirmModal({
      title:"保存并退出？",
      body:"当前答题进度已自动保存，下次进入该测评将从此题继续。是否确认返回首页？",
      confirmText:"保存并退出",
      onConfirm:()=>{ Store.save(this.state); this.toast("进度已保存","success"); this.route("home"); }
    });
  },
  _trySubmit(testId){
    const test = TESTS[testId];
    const prog = this.state.progress[testId];
    const unanswered = [];
    prog.answers.forEach((a,i)=>{ if(a==null) unanswered.push(i+1); });
    if(unanswered.length>0){
      const ul = unanswered.slice(0,20).map(n=>`第${n}题`).join("、") + (unanswered.length>20?" 等":"");
      this.confirmModal({
        title:"存在未作答题目",
        body:`共 ${unanswered.length} 题未作答：${ul}。<br><br>你可以选择「继续补答」返回完善，或选择「强制提交」基于当前已答题目生成结果。`,
        confirmText:"强制提交",
        cancelText:"继续补答",
        danger:true,
        onConfirm:()=>this._submitTest(testId),
      });
      return;
    }
    this.confirmModal({
      title:"确认提交？",
      body:`已完成全部 ${test.count} 题，确认提交以生成测评报告吗？`,
      confirmText:"确认提交",
      onConfirm:()=>this._submitTest(testId),
    });
  },
  _submitTest(testId){
    const prog = this.state.progress[testId];
    const test = TESTS[testId];
    const result = scoreTest(testId, prog.answers.slice());
    const id = "h_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    const hist = {
      id, testId, testShort:test.short, testName:test.name,
      typeName: result.name, typeCode: result.code,
      group: result.group || "",
      nickname: this.state.settings.nickname || "匿名用户",
      timestamp: Date.now(),
      scores: result.scores,
      dims: result.dims,
      summary: result.summary,
      answers: prog.answers.slice(),
    };
    this.state.history.unshift(hist);
    delete this.state.progress[testId];
    Store.save(this.state);
    this.celebrateParticles();
    this.toast("测评完成！报告已生成","success");
    setTimeout(()=>this.route("result",{id}), 400);
  },
  /* utility */
  escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));},
  fmtDate(ts){const d=new Date(ts);return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,"0")}/${d.getDate().toString().padStart(2,"0")} ${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;},

  // Draw radar chart SVG (axes: [{label,value,color}], max value 100)
  drawRadar(containerId, axes, size=300){
    const t0 = performance.now();
    console.log("[MTH-Render] drawRadar 开始", { containerId, axes: axes.length, size, animations: this.state.settings.animations });
    const host = document.getElementById(containerId);
    if(!host){ console.warn("[MTH-Render] drawRadar 容器不存在:", containerId); return; }
    const n = axes.length;
    const cx = size/2, cy = size/2, r = size/2 - 42;
    const angle = (i)=> -Math.PI/2 + i*(Math.PI*2/n);
    // Grid levels
    let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto;">`;
    for(let lv=5; lv>=1; lv--){
      const rr = (r/5)*lv;
      let pts = [];
      for(let i=0;i<n;i++){
        const ang = angle(i);
        pts.push(`${(cx+Math.cos(ang)*rr).toFixed(2)},${(cy+Math.sin(ang)*rr).toFixed(2)}`);
      }
      svg += `<polygon points="${pts.join(" ")}" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="1"/>`;
    }
    // Axes lines
    for(let i=0;i<n;i++){
      const ang = angle(i);
      svg += `<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(ang)*r).toFixed(2)}" y2="${(cy+Math.sin(ang)*r).toFixed(2)}" stroke="currentColor" stroke-opacity=".15"/>`;
    }
    // Value polygon (initial empty, grow in animation)
    const dataPts0 = axes.map((_,i)=>{
      const ang = angle(i);
      return `${cx},${cy}`;
    }).join(" ");
    const dataPtsFinal = axes.map((a,i)=>{
      const ang = angle(i);
      const rr = r * Math.max(0, Math.min(100, a.value)) / 100;
      return `${(cx+Math.cos(ang)*rr).toFixed(2)},${(cy+Math.sin(ang)*rr).toFixed(2)}`;
    }).join(" ");
    // First color as theme gradient
    const c1 = axes[0]?.color || "#4f6ad2";
    svg += `<polygon class="radarPoly" points="${dataPts0}" fill="${c1}" fill-opacity=".18" stroke="${c1}" stroke-width="2"/>`;
    // Axis labels + small dots at final positions
    axes.forEach((a,i)=>{
      const ang = angle(i);
      const lx = cx + Math.cos(ang)*(r+18);
      const ly = cy + Math.sin(ang)*(r+18);
      const anch = Math.abs(Math.cos(ang))<.2 ? "middle" : (Math.cos(ang)>0 ? "start":"end");
      svg += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="${anch}" dominant-baseline="middle" font-size="11" fill="currentColor" opacity=".75">${this.escapeHtml(a.label)} ${a.value}%</text>`;
      const dr = r*Math.max(0,Math.min(100,a.value))/100;
      const dx = cx + Math.cos(ang)*dr, dy = cy + Math.sin(ang)*dr;
      svg += `<circle cx="${dx.toFixed(2)}" cy="${dy.toFixed(2)}" r="3.2" fill="${a.color}" class="radarDot" opacity="0"/>`;
    });
    svg += "</svg>";
    const buildEnd = performance.now();
    console.log("[MTH-Render] drawRadar SVG 字符串构建耗时", (buildEnd-t0).toFixed(2)+"ms", "svg 长度", svg.length);
    host.innerHTML = svg;
    console.log("[MTH-Render] drawRadar innerHTML 写入耗时", (performance.now()-buildEnd).toFixed(2)+"ms");
    // animate polygon morph via requestAnimationFrame
    if(this.state.settings.animations){
      const poly = host.querySelector(".radarPoly");
      const dots = host.querySelectorAll(".radarDot");
      const dur = 900, start = performance.now();
      const ptsA = dataPts0.split(" ").map(p=>p.split(",").map(Number));
      const ptsB = dataPtsFinal.split(" ").map(p=>p.split(",").map(Number));
      const ease = t=> t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      let frameCount = 0;
      const step = (now)=>{
        const p = Math.min(1, (now-start)/dur);
        const t = ease(p);
        const cur = ptsA.map((pt,i)=>{
          const x = pt[0]+(ptsB[i][0]-pt[0])*t;
          const y = pt[1]+(ptsB[i][1]-pt[1])*t;
          return `${x.toFixed(2)},${y.toFixed(2)}`;
        }).join(" ");
        poly.setAttribute("points", cur);
        frameCount++;
        if(p>=1){
          dots.forEach(d=>{ d.setAttribute("opacity", 1); d.style.transition="opacity .3s"; });
          console.log("[MTH-Render] drawRadar 动画结束, 帧数="+frameCount, "动画总耗时", (performance.now()-start).toFixed(2)+"ms", "整体耗时", (performance.now()-t0).toFixed(2)+"ms");
          return;
        }
        requestAnimationFrame(step);
      };
      console.log("[MTH-Render] drawRadar 动画将在 260ms 后启动");
      setTimeout(()=>requestAnimationFrame(step), 260);
    }else{
      const poly = host.querySelector(".radarPoly");
      poly.setAttribute("points", dataPtsFinal);
      host.querySelectorAll(".radarDot").forEach(d=>d.setAttribute("opacity",1));
      console.log("[MTH-Render] drawRadar 动画已关闭, 静态渲染完成, 总耗时", (performance.now()-t0).toFixed(2)+"ms");
    }
  },

  /* =================== REPORT CONTENT (Brief & Detailed) =================== */
  /* Build 8 modules dynamically for any test. Input: hist, mode("brief"|"detail") */
  _mod(title, icon, bodyHTML){
    return `<div class="card report-module slide-up">
      <h3><span class="module-icon">${icon}</span>${title}</h3>
      <div>${bodyHTML}</div>
    </div>`;
  },
  /* Helper: Build aesthetic detail block (subheadings + paragraphs + quote + tip capsule) */
  _detailBlock({subs, paragraphs, quote, tip}){
    let html="";
    if(subs && subs.length){
      subs.forEach((sub)=>{
        html += `<div class="mod-subheading">${this.escapeHtml(sub.title||"")}</div>`;
        const ps = sub.paragraphs||[];
        ps.forEach(p=>{ html += `<p class="mod-p">${this.escapeHtml(p)}</p>`; });
      });
    }
    if(paragraphs && paragraphs.length){
      paragraphs.forEach(p=>{ html += `<p class="mod-p">${this.escapeHtml(p)}</p>`; });
    }
    if(quote){ html += `<blockquote class="report-blockquote">${this.escapeHtml(quote)}</blockquote>`; }
    if(tip){ html += `<div class="module-tip">${this.escapeHtml(tip)}</div>`; }
    return html;
  },
  _reportModules(testId, hist, mode){
    const dims = hist.dims||{};
    const code = hist.typeCode||"";
    const isDetail = mode==="detail";
    switch(testId){
      case "mbti": return this._reportMBTI(hist, dims, code, isDetail);
      case "element": return this._reportElement(hist, dims, isDetail);
      case "ocean": return this._reportOcean(hist, dims, isDetail);
      case "ecr": return this._reportECR(hist, dims, code, isDetail);
      case "holland": return this._reportHolland(hist, dims, code, isDetail);
      case "vark": return this._reportVARK(hist, dims, code, isDetail);
      default: return "";
    }
  },
  _genericModules(parts, mode){
    // parts: {traits, strengths, blindspots, work, relation, stress, direction, actions}
    // + detail-only: {strengthsQuote, blindspotsRiskCallout, blindspotsTip, actionsTip,
    //                  workDetail, relationDetail, stressDetail, directionDetail}
    const isDetail = mode==="detail";
    let s="";
    const icon = {trait:ICONS.star,adv:ICONS.check,warn:ICONS.warn,work:"💼",rel:"🤝",stress:"🌿",dir:"🧭",act:"✅"};
    s += this._mod("核心特质", icon.trait, `<div class="trait-list">${parts.traits.map(t=>`<span class="trait-chip">${this.escapeHtml(t)}</span>`).join("")}</div>`);
    /* 优势模块 detail 时附加金句卡 */
    let advHTML = `<ul>${parts.strengths.map(x=>`<li>${this.escapeHtml(x)}</li></ul>`)}`;
    if(isDetail && parts.strengthsQuote){
      advHTML += `<blockquote class="report-blockquote">${this.escapeHtml(parts.strengthsQuote)}</blockquote>`;
    }
    s += this._mod("性格优势", icon.adv, advHTML);
    if(parts.blindspots && parts.blindspots.length){
      let bsHTML = `<ul>${parts.blindspots.map(x=>`<li>${this.escapeHtml(x)}</li></ul>`)}`;
      if(isDetail){
        if(parts.blindspotsRiskCallout){
          bsHTML += `<div class="risk-callout">${this.escapeHtml(parts.blindspotsRiskCallout)}</div>`;
        }
        if(parts.blindspotsTip){
          bsHTML += `<div class="module-tip">${this.escapeHtml(parts.blindspotsTip)}</div>`;
        }
      }
      s += this._mod("潜在盲点与现实坑点", icon.warn, bsHTML);
    }
    /* 四个正文模块：detail 优先用结构 Detail 对象，无结构时按中文句号自动拆段美化 */
    const autoSplit = (text, quoteLine, tipLine)=>{
      // naive split: keep punctuation with the sentence
      const raw = (text||"").split(/(?<=[。！？!?\.])/).map(s=>s.trim()).filter(Boolean);
      if(raw.length<=1){
        return this._detailBlock({paragraphs:[text||""], quote:quoteLine, tip:tipLine});
      }
      const half = Math.ceil(raw.length/2);
      const p1 = raw.slice(0,half).join("");
      const p2 = raw.slice(half).join("");
      return this._detailBlock({paragraphs:[p1,p2].filter(Boolean), quote:quoteLine, tip:tipLine});
    };
    if(parts.work || parts.workDetail){
      const body = (isDetail && parts.workDetail) ? this._detailBlock(parts.workDetail)
        : (isDetail && parts.work) ? autoSplit(parts.work, parts.workQuote||"把工作当成自我延伸的人，往往比只把工作当差事的人走得更远。", parts.workTip||"每周花 10 分钟复盘：这一周的工作中，哪些时刻让你感觉「我真的在创造价值」？")
        : (parts.work ? `<p class="mod-p">${this.escapeHtml(parts.work)}</p>` : "");
      s += this._mod("工作与学习表现", icon.work, body);
    }
    if(parts.relation || parts.relationDetail){
      const body = (isDetail && parts.relationDetail) ? this._detailBlock(parts.relationDetail)
        : (isDetail && parts.relation) ? autoSplit(parts.relation, parts.relationQuote||"舒服的关系，不是完美适配，而是彼此都愿意为对方留一寸调整的余地。", parts.relationTip||"本周主动给一位「很久没联系但心里很在意」的人发一条真诚的消息。")
        : (parts.relation ? `<p class="mod-p">${this.escapeHtml(parts.relation)}</p>` : "");
      s += this._mod("人际相处模式", icon.rel, body);
    }
    if(parts.stress || parts.stressDetail){
      const body = (isDetail && parts.stressDetail) ? this._detailBlock(parts.stressDetail)
        : (isDetail && parts.stress) ? autoSplit(parts.stress, parts.stressQuote||"压力并不可怕，可怕的是你一直在默默忍耐它而不肯说出口。", parts.stressTip||"写一张「我的解压白名单」：5 件不用有负罪感就能立刻做的小事。")
        : (parts.stress ? `<p class="mod-p">${this.escapeHtml(parts.stress)}</p>` : "");
      s += this._mod("压力触发点与自我解压", icon.stress, body);
    }
    if(parts.direction || parts.directionDetail){
      const body = (isDetail && parts.directionDetail) ? this._detailBlock(parts.directionDetail)
        : (isDetail && parts.direction) ? autoSplit(parts.direction, parts.directionQuote||"选择方向时，先问「我想成为谁」，再问「我要做什么」。", parts.directionTip||"花 20 分钟写一封「给 5 年后的自己」的信，用未来视角反推今年的选择。")
        : (parts.direction ? `<p class="mod-p">${this.escapeHtml(parts.direction)}</p>` : "");
      s += this._mod("适合发展方向", icon.dir, body);
    }
    if(parts.actions && parts.actions.length){
      let actHTML = `<ul class="action-list">${parts.actions.map(x=>`<li>${this.escapeHtml(x)}</li></ul>`)}`;
      if(isDetail && parts.actionsTip){
        actHTML += `<div class="module-tip">${this.escapeHtml(parts.actionsTip)}</div>`;
      }
      s += this._mod("成长行动清单", icon.act, actHTML);
    }
    return s;
  },

  _reportElement(hist, d, detail){

      console.log("[MTH-Render] _chartAxes 构建耗时", (performance.now()-chT0).toFixed(2)+"ms", "轴数="+axes.length);

  _chartAxes(testId, dims){
    const test = TESTS[testId]; if(!test) return [];
    // Build list of label/value/color following test.axes order (so MBTI pairs appear correctly)
    return test.axes.map(a=>({label:a.name,value:Number(dims[a.k]||0),color:a.color}));
  },
  _renderReportModules(hist, mode){
    const t0 = performance.now();
    const el = document.getElementById("reportArea");
    if(!el){ console.warn("[MTH-Render] _renderReportModules reportArea 不存在"); return; }
    const buildT0 = performance.now();
    const html = this._reportModules(hist.testId, hist, mode);
    console.log("[MTH-Render] _renderReportModules HTML 构建耗时", (performance.now()-buildT0).toFixed(2)+"ms", "mode="+mode, "html长度="+html.length);
    const writeT0 = performance.now();
    el.innerHTML = html;
    console.log("[MTH-Render] _renderReportModules innerHTML 写入耗时", (performance.now()-writeT0).toFixed(2)+"ms", "总耗时", (performance.now()-t0).toFixed(2)+"ms");
  },
  /* Canvas share card generator */
  generateShareCard(hist){
    const test = TESTS[hist.testId]; if(!test) return;
    const W = 800, H = 1100;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    // bg gradient
    const g = ctx.createLinearGradient(0,0,W,H);
    const theme = this.state.settings.theme;
    if(theme==="dark"){
      g.addColorStop(0,"#181e30"); g.addColorStop(1,"#2a2148");
    }else{
      g.addColorStop(0,"#eef1fb"); g.addColorStop(1,"#f7f1fa");
    }
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // decorative circle
    ctx.save();
    ctx.globalAlpha = .18;
    const cg = ctx.createLinearGradient(0,0,W,H);
    cg.addColorStop(0,"#4f6ad2"); cg.addColorStop(1,"#9482d1");
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(W+60, -60, 260, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-60, H+60, 240, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // header
    const fc = theme==="dark"?"#eef1f8":"#1a1f36";
    const sc = theme==="dark"?"#9aa4bd":"#5b6478";
    ctx.fillStyle = fc;
    ctx.font = "bold 32px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("Meta-Test-Hub", 56, 88);
    ctx.fillStyle = sc;
    ctx.font = "18px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(test.name, 56, 122);
    // nickname + date
    ctx.fillStyle = sc;
    ctx.font = "17px sans-serif";
    ctx.fillText((hist.nickname||"匿名用户") + "  ·  " + this.fmtDate(hist.timestamp), 56, 154);
    // big type code
    const cg2 = ctx.createLinearGradient(56,200,W-56,360);
    cg2.addColorStop(0,"#4f6ad2"); cg2.addColorStop(.5,"#9482d1"); cg2.addColorStop(1,"#68b8a6");
    ctx.fillStyle = cg2;
    ctx.font = "bold 110px 'Segoe UI',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(hist.typeCode, W/2, 340);
    ctx.textAlign = "left";
    ctx.fillStyle = fc;
    ctx.font = "bold 34px 'PingFang SC',sans-serif";
    ctx.textAlign = "center";
    let sub = hist.typeName + (hist.group?(" · "+hist.group):"");
    // wrap long name
    if(ctx.measureText(sub).width > W-120){
      ctx.font = "bold 28px 'PingFang SC',sans-serif";
    }
    ctx.fillText(sub, W/2, 400);
    // summary
    ctx.fillStyle = sc;
    ctx.font = "20px 'PingFang SC',sans-serif";
    const maxW = W - 120;
    const words = hist.summary.split("");
    let line = "", y = 450, lines = [];
    for(let i=0;i<words.length;i++){
      const test = line + words[i];
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = words[i]; }
      else line = test;
    }
    if(line) lines.push(line);
    lines = lines.slice(0,3);
    lines.forEach((ln,i)=>{ ctx.textAlign="center"; ctx.fillText(ln, W/2, y+i*32); });
    ctx.textAlign = "left";
    y = y + lines.length*32 + 40;
    // bar chart area
    ctx.fillStyle = fc;
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("维度得分", 56, y);
    y += 30;
    const axes = this._chartAxes(hist.testId, hist.dims);
    // Draw up to 8 bars
    const take = axes.slice(0,8);
    const rowH = 42;
    const bx = 56, bw = W-56*2;
    take.forEach((ax,i)=>{
      const ty = y + i*rowH;
      ctx.fillStyle = sc;
      ctx.font = "17px sans-serif";
      ctx.fillText(ax.label, bx, ty+18);
      ctx.fillStyle = (theme==="dark"?"rgba(255,255,255,.08)":"rgba(24,30,48,.06)");
      roundRect(ctx, bx, ty+26, bw, 12, 6, true, false);
      const gw = Math.round((bw) * (ax.value/100));
      const bg2 = ctx.createLinearGradient(bx,0,bx+bw,0);
      bg2.addColorStop(0, ax.color); bg2.addColorStop(1, shade(ax.color,30));
      ctx.fillStyle = bg2;
      roundRect(ctx, bx, ty+26, gw, 12, 6, true, false);
      ctx.fillStyle = fc;
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(ax.value + "%", W-56, ty+18);
      ctx.textAlign = "left";
    });
    y = y + take.length*rowH + 40;
    // footer
    ctx.textAlign = "center";
    const lg = ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,"#4f6ad2"); lg.addColorStop(1,"#9482d1");
    ctx.fillStyle = lg;
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("通用人格测评中心", W/2, H-80);
    ctx.fillStyle = sc;
    ctx.font = "15px sans-serif";
    ctx.fillText("⚠ 仅供娱乐参考 · 本地运行不上传数据", W/2, H-52);
    ctx.textAlign = "left";
    // download
    try{
      const a = document.createElement("a");
      a.download = `MetaTestHub_${test.id}_${hist.typeCode}_${Date.now()}.png`;
      a.href = c.toDataURL("image/png");
      document.body.appendChild(a); a.click(); a.remove();
      this.toast("分享卡片已生成并下载","success");
    }catch(e){
      this.toast("图片生成失败：浏览器可能不支持","error");
    }
    // helpers inside closure
    function roundRect(ctx,x,y,w,h,r,fill,stroke){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
      if(fill) ctx.fill();
      if(stroke) ctx.stroke();
    }
    function shade(hex, percent){
      const h = hex.replace("#","");
      const num = parseInt(h.length===3? h.split("").map(c=>c+c).join(""):h,16);
      let r=(num>>16)&0xff, g=(num>>8)&0xff, b=num&0xff;
      const adj=(c,p)=>Math.max(0,Math.min(255,Math.round(c+(255-c)*p/100)));
      return `rgb(${adj(r,percent)},${adj(g,percent)},${adj(b,percent)})`;
    }
  },

  renderCompare(){
    const ids = this.state.compare||[];
    const items = ids.map(id=>this.state.history.find(h=>h.id===id)).filter(Boolean);
    if(items.length<2){
