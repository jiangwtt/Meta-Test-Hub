  exportBackup(){
    try{
      const payload = JSON.stringify(this.state, null, 2);
      const blob = new Blob([payload], {type:"application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const d = new Date();
      const name = `meta-test-hub-backup-${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,"0")}${d.getDate().toString().padStart(2,"0")}.json`;
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      this.toast("备份文件已导出并下载","success");
    }catch(e){
      this.toast("导出失败：" + (e.message||"未知错误"),"error");
    }
  },
  importBackup(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onerror = ()=> this.toast("读取文件失败","error");
    reader.onload = ()=>{
      const txt = String(reader.result||"");
      let obj = null;
      try{ obj = JSON.parse(txt); }catch(e){}
      if(!obj || typeof obj !== "object"){ this.toast("导入失败：文件格式非法","error"); return; }
      // Basic validation: must have settings or history
      if(!obj.settings && !Array.isArray(obj.history)){ this.toast("导入失败：未识别为有效备份文件","error"); return; }
      this.confirmModal({
        title:"确认导入覆盖？",
        body:"导入将用备份中的设置、进度、历史记录覆盖当前应用数据。建议先导出当前数据做备份以防丢失。",
        confirmText:"确认导入覆盖",
        danger:true,
        onConfirm:()=>{
          const dflt = Store.defaultData();
          const merged = {...dflt, ...obj};
          merged.settings = {...dflt.settings, ...(obj.settings||{})};
          merged.progress = obj.progress || {};
          merged.history = Array.isArray(obj.history)? obj.history : [];
          merged.compare = Array.isArray(obj.compare)? obj.compare : [];
          if(typeof merged.settings.animations !== "boolean") merged.settings.animations = true;
          this.state = merged;
          Store.save(this.state);
          this.applySettings();
          this.toast("导入成功，应用已还原到备份状态","success");
          setTimeout(()=>this.route("home"), 600);
        }
      });
    };
    reader.readAsText(file, "utf-8");
  },

        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-name">全局动画开关</div>
            <div class="setting-desc">关闭后将禁用全部动效，适合低配设备、节省电量或降低视觉干扰。</div>
          </div>
          <label class="switch"><input type="checkbox" id="swAnim" ${s.animations?'checked':''}><span class="switch-slider"></span></label>
        </div>
      </div>
      <div class="settings-group">
        <h3>字体与阅读</h3>
        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-name">字体大小</div>
            <div class="setting-desc">三档调节，适配不同视力与阅读偏好。</div>
          </div>
          <div class="seg-control" id="segFont">
            <button class="seg-btn ${s.fontSize==='standard'?'active':''}" data-v="standard">标准</button>
            <button class="seg-btn ${s.fontSize==='large'?'active':''}" data-v="large">大</button>
            <button class="seg-btn ${s.fontSize==='xlarge'?'active':''}" data-v="xlarge">更大</button>
          </div>
        </div>
      </div>
      <div class="settings-group">
        <h3>用户与报告默认</h3>
        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-name">默认昵称</div>
            <div class="setting-desc">显示在报告与分享卡片中。</div>
          </div>
          <input class="nickname-input" id="setNick" style="max-width:240px" maxlength="20" value="${this.escapeHtml(s.nickname||"")}" placeholder="请输入昵称">
        </div>
        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-name">报告默认展示模式</div>
            <div class="setting-desc">查看结果页时默认加载的报告模式。</div>
          </div>
          <div class="seg-control" id="segMode">
            <button class="seg-btn ${s.reportMode==='brief'?'active':''}" data-v="brief">简略泛版</button>
            <button class="seg-btn ${s.reportMode==='detail'?'active':''}" data-v="detail">详细完整版</button>
          </div>
        </div>
      </div>
      <div class="settings-group">
        <h3>隐私说明</h3>
        <div class="card" style="padding:22px;line-height:1.9;color:var(--text-secondary);font-size:.93rem;">
          <p><strong>数据存储：</strong>本应用 100% 在浏览器前端运行，所有答题进度、历史记录、个人设置均保存在本机浏览器 LocalStorage 中。</p>
          <p style="margin-top:10px;"><strong>无外部连接：</strong>不发起任何网络请求，不调用第三方 API，不引入任何 CDN 资源，断网条件下仍可完整使用全部功能。</p>
          <p style="margin-top:10px;"><strong>数据控制：</strong>你完全掌控所有数据——可随时在「数据管理」页导出 JSON 备份、导入恢复、或清空本机全部数据。清除浏览器数据会导致本应用本地数据同步丢失，请提前导出备份。</p>
          <p style="margin-top:10px;"><strong>免责声明：</strong>本项目仅为前端技术演示与趣味娱乐工具，测评结果仅供个人自我参考，不构成专业心理诊断、职业咨询、医疗建议，请勿作为重大决策的唯一依据。</p>
        </div>
      </div>
    </section>`;
    // Theme
    document.querySelectorAll("#segTheme .seg-btn").forEach(b=>{
      b.onclick = ()=>{
        const v = b.getAttribute("data-v");
        this.state.settings.theme = v; Store.save(this.state); this.applySettings();
        this.renderSettings();
      };
    });
    // Animations
    document.getElementById("swAnim").addEventListener("change",(e)=>{
      this.state.settings.animations = e.target.checked;
      Store.save(this.state); this.applySettings();
      this.toast(e.target.checked?"已启用全部动画":"已关闭全部动画","success");
    });
    // Font size
    document.querySelectorAll("#segFont .seg-btn").forEach(b=>{
      b.onclick = ()=>{
        const v = b.getAttribute("data-v");
        this.state.settings.fontSize = v; Store.save(this.state); this.applySettings();
        this.renderSettings();
      };
    });
    // Nickname
    const ni = document.getElementById("setNick");
    ni.addEventListener("input",()=>{
      this.state.settings.nickname = ni.value.trim();
      Store.save(this.state);
    });
    // Report mode
    document.querySelectorAll("#segMode .seg-btn").forEach(b=>{
      b.onclick = ()=>{
        const v = b.getAttribute("data-v");
        this.state.settings.reportMode = v; Store.save(this.state);
        this.renderSettings();
      };
    });
  },
}; // END App object

/* ============ BOOTSTRAP ============ */
window.App = App;
document.addEventListener("DOMContentLoaded",()=>{
  try{ App.init(); }
  catch(e){
    console.error(e);
    // Fallback error recovery: re-init with rescue
    try{
      App.state = Store.rescue();
      App.applySettings();
      App.handleRoute();
      App.toast("已检测到异常并自动恢复，请检查数据是否完整","info");
    }catch(err){
      document.getElementById("appView").innerHTML = `<section class="page-wrap"><div class="card"><h2 style="color:#c95568">初始化失败</h2><p style="margin-top:10px;color:#5b6478">请尝试清除浏览器 LocalStorage 后刷新页面。错误信息：${String(err.message||err)}</p></div></section>`;
    }
  }
});
})();
</script>
</body>
</html>
